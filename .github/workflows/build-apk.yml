
name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          echo "PATH=$JAVA_HOME/bin:$PATH" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Python tools
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer Cython==0.29.36

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          SPEC=$(find source -type f -name buildozer.spec -print -quit)
          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Configure Android NDK
        run: |
          SPEC="$PROJECT_DIR/buildozer.spec"
          if grep -q '^android.ndk *=' "$SPEC"; then
            sed -i 's/^android.ndk *=.*/android.ndk = 28c/' "$SPEC"
          else
            echo 'android.ndk = 28c' >> "$SPEC"
          fi

      - name: Build Android APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:$PATH"
          java -version
          javac -version
          cd "$PROJECT_DIR"
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: source/**/bin/*.apk
          if-no-files-found: error
          retention-days: 7
