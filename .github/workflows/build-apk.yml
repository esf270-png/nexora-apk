
name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            python3-dev \
            python3-pip \
            python3-venv

      - name: Install Buildozer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade \
            --break-system-packages \
            pip setuptools wheel

          python3 -m pip install --user \
            --break-system-packages \
            buildozer \
            Cython==0.29.36

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 3 -type f \
            \( -name 'buildozer.spec' -o -name 'rirex.py' -o -name 'main.py' -o -iname '*.zip' \) \
            -print

          SPEC="$(find . -type f -name buildozer.spec \
            -not -path './.git/*' -print -quit)"

          if [ -n "$SPEC" ]; then
            PROJECT_DIR="$(dirname "$SPEC")"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: buildozer.spec and project ZIP were not found."
              echo "Add the complete Android project to the repository."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/nexora_source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nexora_source"

            SPEC="$(find "$RUNNER_TEMP/nexora_source" \
              -type f -name buildozer.spec -print -quit)"

            if [ -z "$SPEC" ]; then
              echo "ERROR: ZIP does not contain buildozer.spec."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f buildozer.spec

          echo "Project files:"
          ls -la

          echo "Checking Python syntax..."
          python3 -m compileall -q .

          echo "Buildozer configuration:"
          grep -E '^(title|package.name|package.domain|source.dir|source.include_exts|requirements|orientation|android.api|android.minapi|android.ndk)' \
            buildozer.spec || true

      - name: Prepare Android build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:$PATH"

          cd "$PROJECT_DIR"

          if ! grep -q '^\[app\]' buildozer.spec; then
            echo "ERROR: [app] section is missing."
            exit 1
          fi

          if ! grep -q '^source.include_exts' buildozer.spec; then
            echo "WARNING: source.include_exts is not configured."
          fi

          if ! grep -q '^requirements' buildozer.spec; then
            echo "WARNING: requirements is not configured."
          fi

          echo "Build environment:"
          python3 --version
          buildozer --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROIDSDK=${ANDROIDSDK:-not set}"
          echo "ANDROIDNDK=${ANDROIDNDK:-not set}"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

          cd "$PROJECT_DIR"

          buildozer -v android debug

      - name: Show build diagnostics
        if: always()
        shell: bash
        run: |
          echo "Searching for APK files..."
          find . "$RUNNER_TEMP" \
            -type f -name '*.apk' -print 2>/dev/null || true

          echo "Searching for Buildozer logs..."
          find . "$HOME/.buildozer" \
            -type f \( -name '*.log' -o -name 'buildozer.spec' \) \
            -print 2>/dev/null | head -100 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: |
            **/bin/*.apk
            /home/runner/.buildozer/**/*.apk
          if-no-files-found: error
          retention-days: 7
