
name: Build NEXORA APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Verify environment
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          python3 --version
          python3 -m pip --version

      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            python3-dev \
            python3-pip \
            python3-venv

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python3 -m venv "$RUNNER_TEMP/build-venv"

          "$RUNNER_TEMP/build-venv/bin/python" -m pip install \
            --upgrade pip setuptools wheel

          "$RUNNER_TEMP/build-venv/bin/python" -m pip install \
            buildozer \
            Cython==0.29.36

          "$RUNNER_TEMP/build-venv/bin/buildozer" --version

          echo "$RUNNER_TEMP/build-venv/bin" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SPEC="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name buildozer.spec \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -n "$SPEC" ]; then
            PROJECT_DIR="$(dirname "$SPEC")"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No buildozer.spec or project ZIP found."
              find "$GITHUB_WORKSPACE" \
                -maxdepth 4 -type f -print
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/nexora-source"
            unzip -q "$ZIP_FILE" \
              -d "$RUNNER_TEMP/nexora-source"

            SPEC="$(find "$RUNNER_TEMP/nexora-source" \
              -type f \
              -name buildozer.spec \
              -print -quit)"

            if [ -z "$SPEC" ]; then
              echo "ERROR: ZIP does not contain buildozer.spec."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          if ! grep -q '^\[app\]' buildozer.spec; then
            echo "ERROR: Missing [app] section."
            exit 1
          fi

          echo "Project files:"
          ls -la

          echo "Checking Python syntax..."
          python3 -m compileall -q .

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          export PATH="$JAVA_HOME/bin:$RUNNER_TEMP/build-venv/bin:/usr/bin:/bin"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          python3 --version

          cd "$PROJECT_DIR"

          "$RUNNER_TEMP/build-venv/bin/buildozer" -v android debug \
            2>&1 | tee "$RUNNER_TEMP/buildozer.log"

      - name: Show build diagnostics
        if: always()
        shell: bash
        run: |
          echo "APK files:"

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "${PROJECT_DIR:-}" ]; then
            find "$PROJECT_DIR" \
              -type f -name '*.apk' -print || true
          fi

          echo "Last 200 lines of build log:"

          if [ -f "$RUNNER_TEMP/buildozer.log" ]; then
            tail -n 200 "$RUNNER_TEMP/buildozer.log"
          else
            echo "Build log not found."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Build-Log
          path: ${{ runner.temp }}/buildozer.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 7
