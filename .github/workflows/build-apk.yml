
name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Verify Java
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          javac -version
          test -x "$JAVA_HOME/bin/javac"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Python tools
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user \
            buildozer \
            Cython==0.29.36

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          SPEC=$(find source -type f -name buildozer.spec -print -quit)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found inside ZIP."
            find source -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          SPEC="$PROJECT_DIR/buildozer.spec"

          if grep -q '^android.ndk *=' "$SPEC"; then
            sed -i 's/^android.ndk *=.*/android.ndk = 28c/' "$SPEC"
          else
            echo 'android.ndk = 28c' >> "$SPEC"
          fi

          echo "Configured NDK:"
          grep '^android.ndk *=' "$SPEC"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

          cd "$PROJECT_DIR"

          python3 -m compileall -q .
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: source/**/bin/*.apk
          if-no-files-found: error
          retention-days: 7
