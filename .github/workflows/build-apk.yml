```yaml
name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Verify Java and Python
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          python3 --version
          python3 -m pip --version

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            python3-dev \
            python3-pip \
            python3-venv

      - name: Install Buildozer with system Python
        shell: bash
        run: |
          set -e

          # Install outside any virtual environment.
          sudo python3 -m pip install \
            buildozer \
            Cython==0.29.36

          # Confirm that the system installation is being used.
          echo "Buildozer executable:"
          command -v /usr/local/bin/buildozer

          echo "Buildozer version:"
          /usr/local/bin/buildozer --version

          echo "Buildozer Python interpreter:"
          head -n 1 /usr/local/bin/buildozer

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SPEC="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name buildozer.spec \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -n "$SPEC" ]; then
            PROJECT_DIR="$(dirname "$SPEC")"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No buildozer.spec or project ZIP found."
              find "$GITHUB_WORKSPACE" \
                -maxdepth 4 -type f -print
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/nexora-source"
            unzip -q "$ZIP_FILE" \
              -d "$RUNNER_TEMP/nexora-source"

            SPEC="$(find "$RUNNER_TEMP/nexora-source" \
              -type f \
              -name buildozer.spec \
              -print -quit)"

            if [ -z "$SPEC" ]; then
              echo "ERROR: ZIP does not contain buildozer.spec."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f buildozer.spec

          echo "Project files:"
          ls -la

          echo "Checking Python syntax..."
          python3 -m compileall -q .

          if ! grep -q '^\[app\]' buildozer.spec; then
            echo "ERROR: Missing [app] section in buildozer.spec."
            exit 1
          fi

          echo "Project validation passed."

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          # Avoid accidentally invoking an old Buildozer from ~/.local/bin.
          export PATH="$JAVA_HOME/bin:/usr/local/bin:/usr/bin:/bin"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "Python:"
          python3 --version

          echo "Buildozer path:"
          command -v buildozer

          echo "Buildozer version:"
          /usr/local/bin/buildozer --version

          echo "Java:"
          java -version
          javac -version

          cd "$PROJECT_DIR"

          # Save the complete output, including errors.
          /usr/local/bin/buildozer -v android debug \
            2>&1 | tee "$RUNNER_TEMP/buildozer.log"

      - name: Show build diagnostics
        if: always()
        shell: bash
        run: |
          echo "Searching for generated APK files..."

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "${PROJECT_DIR:-}" ]; then
            find "$PROJECT_DIR" \
              -type f -name '*.apk' -print || true
          fi

          echo "Build log:"
          if [ -f "$RUNNER_TEMP/buildozer.log" ]; then
            echo "Last 200 lines of the Buildozer log:"
            tail -n 200 "$RUNNER_TEMP/buildozer.log"
          else
            echo "No Buildozer log was generated."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Build-Log
          path: ${{ runner.temp }}/buildozer.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 7
```
