
name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            python3-dev \
            python3-pip \
            python3-venv

      - name: Install Buildozer outside virtualenv
        shell: bash
        run: |
          set -euo pipefail

          python3 --version
          python3 -m pip --version

          python3 -m pip install --user \
            buildozer \
            Cython==0.29.36

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SPEC="$(find . -type f -name buildozer.spec \
            -not -path './.git/*' -print -quit)"

          if [ -n "$SPEC" ]; then
            PROJECT_DIR="$(dirname "$SPEC")"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f \
              -iname '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No buildozer.spec or project ZIP found."
              find . -maxdepth 3 -type f -print
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/nexora-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nexora-source"

            SPEC="$(find "$RUNNER_TEMP/nexora-source" \
              -type f -name buildozer.spec -print -quit)"

            if [ -z "$SPEC" ]; then
              echo "ERROR: ZIP does not contain buildozer.spec."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          echo "Project files:"
          ls -la

          python3 -m compileall -q .

          if ! grep -q '^\[app\]' buildozer.spec; then
            echo "ERROR: Missing [app] section."
            exit 1
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "Python:"
          python3 --version

          echo "Buildozer:"
          command -v buildozer
          buildozer --version

          echo "Java:"
          java -version
          javac -version

          cd "$PROJECT_DIR"

          buildozer -v android debug

      - name: Show build diagnostics
        if: always()
        shell: bash
        run: |
          echo "APK files:"
          find . "$RUNNER_TEMP" \
            -type f -name '*.apk' -print 2>/dev/null || true

          echo "Buildozer files:"
          find "$HOME/.buildozer" \
            -type f -name '*.log' -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: |
            **/bin/*.apk
          if-no-files-found: error
          retention-days: 7
