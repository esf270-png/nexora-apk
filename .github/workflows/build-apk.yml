
name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            python3-dev \
            python3-venv

      - name: Install Buildozer
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --upgrade pip setuptools wheel
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install buildozer Cython==0.29.36

          echo "$RUNNER_TEMP/build-venv/bin" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SPEC="$(find . -type f -name buildozer.spec \
            -not -path './.git/*' -print -quit)"

          if [ -n "$SPEC" ]; then
            PROJECT_DIR="$(dirname "$SPEC")"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: buildozer.spec or project ZIP not found."
              echo "Repository contents:"
              find . -maxdepth 3 -type f -print
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/nexora-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nexora-source"

            SPEC="$(find "$RUNNER_TEMP/nexora-source" \
              -type f -name buildozer.spec -print -quit)"

            if [ -z "$SPEC" ]; then
              echo "ERROR: buildozer.spec not found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f buildozer.spec

          echo "Project files:"
          ls -la

          python3 -m compileall -q .

          if ! grep -q '^\[app\]' buildozer.spec; then
            echo "ERROR: Missing [app] section in buildozer.spec."
            exit 1
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$JAVA_HOME/bin:$RUNNER_TEMP/build-venv/bin:$HOME/.local/bin:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

          cd "$PROJECT_DIR"

          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: |
            **/bin/*.apk
          if-no-files-found: error
          retention-days: 7
